          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-paper-kraft"><input type="radio" name="paper_type" value="kraft" {{if eq .Settings.DefaultPaperType "kraft"}}checked{{end}} /></span>
            kraft
          </label>
        </div>
      </div>

      <hr class="piece piece-div drawably-divider" id="rule-pauta" />

      <!-- Pauta -->
      <div class="menu-field">
        <div class="field-label">
          <span id="lbl-pauta">Pauta</span>
        </div>
        <div class="options-row">
          <label class="check-label">
            <span class="radio-wrap" id="wrap-pat-dotted"><input type="radio" name="paper_pattern" value="dotted" {{if eq .Settings.DefaultPaperPattern "dotted"}}checked{{end}} /></span>
            pontilhado
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-pat-grid"><input type="radio" name="paper_pattern" value="grid" {{if eq .Settings.DefaultPaperPattern "grid"}}checked{{end}} /></span>
            quadriculado
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-pat-lines"><input type="radio" name="paper_pattern" value="lines" {{if eq .Settings.DefaultPaperPattern "lines"}}checked{{end}} /></span>
            linhas
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-pat-plain"><input type="radio" name="paper_pattern" value="plain" {{if eq .Settings.DefaultPaperPattern "plain"}}checked{{end}} /></span>
            liso
          </label>
        </div>
      </div>

      <hr class="piece piece-div drawably-divider" id="rule-caneta" />

      <!-- Caneta -->
      <div class="menu-field">
        <div class="field-label">
          <span id="lbl-caneta">Caneta</span>
        </div>
        <div class="options-row">
          <label class="check-label">
            <span class="radio-wrap" id="wrap-pen-blue"><input type="radio" name="pen_color" value="blue" {{if eq .Settings.DefaultPenColor "blue"}}checked{{end}} /></span>
            azul
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-pen-black"><input type="radio" name="pen_color" value="black" {{if eq .Settings.DefaultPenColor "black"}}checked{{end}} /></span>
            preta
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-pen-red"><input type="radio" name="pen_color" value="red" {{if eq .Settings.DefaultPenColor "red"}}checked{{end}} /></span>
            vermelha
          </label>
        </div>
      </div>

      <hr class="piece piece-div drawably-divider" id="rule-align" />

      <!-- Alinhamento -->
      <div class="menu-field">
        <div class="field-label">
          <span id="lbl-align">Alinhamento</span>
        </div>
        <div class="options-row">
          <label class="check-label">
            <span class="radio-wrap" id="wrap-align-left"><input type="radio" name="alignment" value="left" {{if or (eq .Settings.DefaultAlignment "left") (eq .Settings.DefaultAlignment "corner")}}checked{{end}} /></span>
            esquerda
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-align-center"><input type="radio" name="alignment" value="center" {{if eq .Settings.DefaultAlignment "center"}}checked{{end}} /></span>
            centro
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-align-right"><input type="radio" name="alignment" value="right" {{if eq .Settings.DefaultAlignment "right"}}checked{{end}} /></span>
            direita
          </label>
          <label class="check-label">
            <span class="radio-wrap" id="wrap-align-justify"><input type="radio" name="alignment" value="justify" {{if eq .Settings.DefaultAlignment "justify"}}checked{{end}} /></span>
            justificada
          </label>
        </div>
      </div>

      <hr class="piece piece-div drawably-divider" id="rule-mouse" />

      <!-- Mouse -->
      <div class="menu-field">
        <div class="field-label">
          <span id="lbl-mouse">Mouse</span>
        </div>
        <label class="check-label">
          <span class="check-wrap" id="wrap-shake"><input type="checkbox" id="shake-toggle" {{if .Settings.ShakeEnabled}}checked{{end}} /></span>
          balançar para ocultar/exibir
        </label>
      </div>

      <hr class="piece piece-div drawably-divider" id="rule-keymaps" />

      <!-- Keymaps -->
      <div class="menu-field">
        <div class="field-label">
          <span id="lbl-keymaps">Keymaps</span>
        </div>
        <ul class="piece-list" id="shortcuts-list">
          <li>criar nota: Cmd+Shift+N (ou botão +)</li>
          <li>ajustes: Cmd+Shift+A (ou botão *)</li>
          <li>apagar nota: Cmd+Shift+D (ou botão x)</li>
          <li>ocultar/exibir: Cmd+Shift+P (ou balançar mouse)</li>
        </ul>
      </div>

      <!-- Footer Actions -->
      <div class="menu-footer">
        <button id="btn-toggle-all" class="drawably-btn" type="button">Ocultar / Exibir</button>
        <button id="btn-new-note" class="drawably-btn" type="button">Criar Nota</button>
      </div>

    </div>
  </div>

  <script>
{{.DrawablyJS}}
{{.MenuJS}}

    document.addEventListener("DOMContentLoaded", () => {
      initMenu({{.SettingsJSON}});
    });
  </script>
</body>
</html>
