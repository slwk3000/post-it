<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
{{.CaveatFontFace}}
{{.DrawablyCSS}}
{{.PaperCSS}}
  </style>
</head>
<body>
  <div id="postit-card" class="postit-card paper-{{.Note.PaperType}} pattern-{{.Note.PaperPattern}} pen-{{.Note.PenColor}}">
    
    <!-- Pin / Header Drag Area -->
    <div id="drag-header" class="postit-header">
      <div class="header-drag-zone" title="Arraste para mover">
        <div class="tape-pin"></div>
      </div>
      <div class="header-actions">
        <button id="btn-new" class="drawably-btn" title="Nova Nota">+</button>
        <button id="btn-menu" class="drawably-btn" title="Ajustes">*</button>
        <button id="btn-delete" class="drawably-btn" title="Excluir">x</button>
      </div>
    </div>

    <!-- Note Content Area -->
    <div class="postit-content" id="postit-content">
      <div id="note-text"
           class="postit-textarea pen-{{.Note.PenColor}} align-{{.Note.Alignment}}"
           spellcheck="false"></div>
    </div>

    <!-- Quick Footer -->
    <div class="postit-footer">
      <div class="resize-handle" title="Redimensionar"></div>
    </div>
  </div>

  <script>
{{.DrawablyJS}}
{{.NoteJS}}

    // Auto-initialize note with Go payload
    document.addEventListener("DOMContentLoaded", () => {
      initNote({{.NoteJSON}});
    });
  </script>
</body>
</html>
